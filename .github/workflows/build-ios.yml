name: Build iOS App (.ipa) with Dynamic Island

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              clean build
          else
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              clean build
          fi

      - name: Package App into .IPA
        run: |
          # 1. Compile and Embed Widget Extension into App.app/PlugIns/
          WIDGET_DIR="ios/App/build/Build/Products/Release-iphoneos/App.app/PlugIns/VigorWidgets.appex"
          mkdir -p "$WIDGET_DIR"

          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.2 \
            -O \
            -whole-module-optimization \
            -parse-as-library \
            -emit-executable \
            -o "$WIDGET_DIR/VigorWidgets" \
            ios/App/VigorWidgets/RestTimerAttributes.swift \
            ios/App/VigorWidgets/RestTimerLiveActivity.swift \
            ios/App/VigorWidgets/VigorWidgetsBundle.swift

          cp ios/App/VigorWidgets/Info.plist "$WIDGET_DIR/Info.plist"
          echo "VigorWidgets Extension embedded successfully!"

          # 2. Package App into .IPA
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Vigor-Gym-iOS.ipa Payload
          echo "IPA Package created successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vigor-Gym-iOS-IPA
          path: Vigor-Gym-iOS.ipa
          retention-days: 14
